/**:
  ros__parameters:
    model:
      # launch file supplies package-share defaults. Missing files keep fail-safe active.
      path: ""
      manifest_path: ""
      device: "cpu"

    preprocessing:
      raw_beams: 1080
      canonical_beams: 360
      frame_stack: 4
      expected_range_max: 30.0
      expected_angle_min: -2.356194490192345
      expected_angle_max: 2.356194490192345
      metadata_tolerance: 0.01

    action:
      # These values must exactly match policy_manifest.json.
      # Authoritative vehicle metadata currently declares 0.64 rad.
      steering_max_abs: 0.64
      acceleration_min: -3.2
      acceleration_max: 3.2

    control:
      rate_hz: 20.0
      steering_rate_limit: 1.5
      acceleration_rate_limit: 6.0

    failsafe:
      scan_timeout_seconds: 0.25
      minimum_valid_beam_ratio: 0.5
      safe_acceleration: -1.0

    debug:
      # Keep system-level p50/p95 inference metrics available in evaluation logs.
      enabled: true
      log_interval_seconds: 5.0
