/**:
  ros__parameters:
    model:
      path: ""
      manifest_path: ""
      device: "cpu"

    preprocessing:
      raw_beams: 750
      raw_range_min: 0.0
      raw_range_max: 25.0
      raw_angle_min: -1.5666074752807617
      raw_angle_max: 1.5707963705062866
      canonical_beams: 360
      frame_stack: 4
      expected_range_max: 25.0
      expected_angle_min: -1.5707963267948966
      expected_angle_max: 1.5707963267948966
      metadata_tolerance: 0.01

    action:
      steering_max_abs: 0.64
      acceleration_min: -3.2
      acceleration_max: 3.2

    control:
      rate_hz: 20.0
      steering_rate_limit: 1.5
      acceleration_rate_limit: 6.0

    failsafe:
      scan_timeout_seconds: 0.25
      minimum_valid_beam_ratio: 0.5
      safe_acceleration: -1.0

    debug:
      enabled: true
      log_interval_seconds: 5.0
