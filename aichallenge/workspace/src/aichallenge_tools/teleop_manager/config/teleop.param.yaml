/**:
  ros__parameters:
    # --- 基本設定 ---
    speed_scale:          2.0
    steer_scale:          1.0
    timer_hz:             50.0
    joy_timeout_sec:      0.5 

    # --- モード切替ボタン ---
    joy_button_index:     2   # △ボタンで手動モード
    ack_button_index:     3   # □ボタンで自律モード
    awsim_button_index:   1   # ○ボタンでAWSIMモード
    reset_button_index:   0   # ×ボタンでリセット

    # --- ギア切替ボタン (負値は未割り当て) ---
    # R1/L1 を録画操作専用にするため、Joyconのギア操作は無効。
    drive_button_index:   -1
    reverse_button_index: -1

    # --- AWSIM ターボブースト (押すたびに発火) ---
    boost_button_index:   8   # /awsim/cmd へ [1.0]→[0.0] を送信(AWSIM側トグル)

    # --- rosbag start/stop トリガボタン ---
    start_button_index:   5   # R1 で start=true
    stop_button_index:    4   # L1 で start=false

    # --- スロットル/ステアリング軸インデックス ---
    # R2/L2: 未押下=1.0、最大押下=-1.0。出力は R2押下量 - L2押下量。
    positive_throttle_axis_index: 5   # R2 (正のスロットル)
    negative_throttle_axis_index: 2   # L2 (負のスロットル)
    throttle_deadzone:    0.05
    steer_axis_index:     0   # ステアリング (axes[0] 左スティック横)

    # --- 十字キー（D-pad）軸インデックス ---
    dpad_lr_axis_index:   6   # 左右 (axes[6])
    dpad_ud_axis_index:   7   # 上下 (axes[7])

    reset_frame_id: "map"
    reset_pos_x: 89666.01577151686
    reset_pos_y: 43124.3307874416
    reset_pos_z: 0.0
    reset_ori_x: 0.0
    reset_ori_y: 0.0
    reset_ori_z: -0.9683930510846941
    reset_ori_w: 0.24942914547196962

## button index (DualShock4) humble

# 0: □
# 1: ×
# 2: ○
# 3: △
# 4: L1
# 5: R1
# 6: L2
# 7: R2
# 8: share
# 9: option
# 10: home
# 11: L3
# 12: R3

## axes index (DualShock4) for D-pad
# R2: axes[5] (released=1.0, fully pressed=-1.0)
# L2: axes[2] (released=1.0, fully pressed=-1.0)
# →: axes[6] == -1.0  → steer_offset +
# ←: axes[6] ==  1.0  → steer_offset –
# ↑: axes[7] ==  1.0  → speed_offset +
# ↓: axes[7] == -1.0  → speed_offset –
