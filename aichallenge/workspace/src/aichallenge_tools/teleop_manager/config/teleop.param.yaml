/**:
  ros__parameters:
    # --- 基本設定 ---
    speed_scale:          1.0  
    steer_scale:          1.0
    timer_hz:             50.0
    joy_timeout_sec:      0.5 

    # --- スティック軸 ---
    throttle_axis_index:  1   # left stick vertical
    steer_axis_index:     0   # left stick horizontal
    throttle_axis_sign:   1.0 # 前後が逆なら -1.0
    steer_axis_sign:      1.0 # 左右が逆なら -1.0

    # --- モード切替ボタン ---
    joy_button_index:     3   # △ボタンで手動モード
    ack_button_index:     2   # □ボタンで自律モード
    awsim_button_index:   1   # ○ボタンでAWSIMモード
    reset_button_index:   0   # ×ボタンでリセット

    # --- start/stop トリガボタン ---
    start_button_index:   10  # R1 ボタンで start=true
    stop_button_index:    9   # L1 ボタンで start=false

    # --- 十字キー（D-pad）ボタン ---
    speed_scale_inc_button_index: 11 # ↑
    speed_scale_dec_button_index: 12 # ↓
    steer_scale_dec_button_index: 13 # ←
    steer_scale_inc_button_index: 14 # →

    reset_frame_id: "map"
    reset_pos_x: 89666.01577151686
    reset_pos_y: 43124.3307874416
    reset_pos_z: 0.0
    reset_ori_x: 0.0
    reset_ori_y: 0.0
    reset_ori_z: -0.9683930510846941
    reset_ori_w: 0.24942914547196962

## button index (DualShock4) humble

# 0: ×
# 1: ○
# 2: □
# 3: △
# 4: option
# 5: ---
# 6: share
# 7: L3
# 8: R3
# 9: L1
# 10: R1
# 11: ↑
# 12: ↓
# 13: ←
# 14: ➡︎
# 15: ---
# 16: home

## axes index (DualShock4)
# [0]: left stick horizontal
# [1] left stick vertical
# [2] right stick horizontal
# [3] right stick vertical
