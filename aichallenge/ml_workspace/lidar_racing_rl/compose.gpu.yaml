services:
  lidar-rl:
    environment:
      JAX_PLATFORMS: "${JAX_PLATFORMS:-cuda}"
      # Avoid reserving most VRAM before the large Replay arrays are created,
      # and use CUDA's async pool to reduce long-run allocation fragmentation.
      XLA_PYTHON_CLIENT_PREALLOCATE: "${XLA_PYTHON_CLIENT_PREALLOCATE:-false}"
      TF_GPU_ALLOCATOR: "${TF_GPU_ALLOCATOR:-cuda_malloc_async}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Do not let a CUDA-specific environment replace packages in the CPU
      # environment when both modes are used on the same Docker host.
      - lidar-rl-gpu-venv:/opt/lidar-rl-venv

volumes:
  lidar-rl-gpu-venv:
