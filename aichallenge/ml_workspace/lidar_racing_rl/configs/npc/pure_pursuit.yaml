count: 3
learned: false
save_transitions: false

lateral_controller:
  name: pure_pursuit
  implementation: jax
  vectorized: true
  reference_line: centerline

longitudinal_controller:
  waypoint_target_speed: true
  base_target_speed: 8.0
  gt_safe_following: true
  distance_gain: 0.5
  lateral_gate: 1.5
  safe_following_distance: {min: 3.0, max: 6.0}

randomization:
  waypoint_line: true
  # Re-sampled independently every episode, then ordered from the nearest
  # (slowest) NPC to the farthest (fastest) NPC.  Straight targets are
  # therefore 3.52--4.24 m/s. Against the demonstrated ~5 m/s Step-1 Ego, the
  # 12/24/36 m starting gaps remain catchable within one Spielberg lap.
  speed_multiplier: {min: 0.44, max: 0.53}
  # Keep the introductory traffic on centerline; add line diversity later.
  lateral_offset: {min: 0.0, max: 0.0}
  lookahead: {min: 1.5, max: 4.0}
  steering_gain: {min: 0.9, max: 1.1}
  control_delay_steps: {min: 0, max: 0}
  acceleration_gain: {min: 0.8, max: 1.2}
  braking_event:
    # Disabled for the introductory phase. Later curriculum phases may lower
    # a non-negative target speed, but must never force an NPC into reverse.
    probability: 0.0
    start_step: {min: 100, max: 1200}
    duration_steps: {min: 10, max: 60}
    acceleration: -2.0

gt_usage:
  front_vehicle_detection: true
  actor_observation: false
  critic_observation: false
