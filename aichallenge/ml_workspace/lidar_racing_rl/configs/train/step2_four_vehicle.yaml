# @package _global_

defaults:
  # AWSIM-calibrated response randomization is not connected to the simulator
  # yet. Keep the runnable Step 2 prototype on dynamic LiDAR only.
  - /env: dynamic_lidar
  - /vehicle: f1tenth_nominal
  - /npc: pure_pursuit
  - /agent: sac
  - _self_

experiment:
  name: step2_four_vehicle
  stage: step2
  description: LiDAR-only Ego SAC with three fixed-policy NPC vehicles

seed:
  master: 0
  environment: 1
  reset: 2
  action: 3
  replay: 4
  evaluation: 5

env:
  num_envs: 64
  num_agents: 4
  episode:
    # Slow following and waiting for a safe pass must remain feasible. At the
    # 50 ms control period this permits 150 simulated seconds.
    max_steps: 3000
  reset:
    # Place Ego/NPC1/NPC2/NPC3 at 0/12/24/36 m in track order.  This leaves
    # twice the maximum safe-following distance between vehicles and spreads
    # the three encounters over more of the 343 m Spielberg lap.
    longitudinal_spacing: 12.0

training:
  ego_agent_index: 0
  save_npc_transitions: false
  opponent_pool_enabled: false
  resume_from: null
  # Cross-stage transfer loads only Actor params. Critic, target Critic,
  # temperature, optimizer states, replay, and counters start from Step 2 zero.
  initialize_actor_from: null
  total_environment_transitions: 2000000
  log_interval_collections: 100
  require_clean_repositories: true

agent:
  optimizer:
    # Protect the Step 1 policy after the Critic-only transfer phase.
    actor_learning_rate: 0.00003
  update:
    # The Step 2 Critic and target Critic are new. Fit them to traffic replay
    # before allowing either Actor or entropy-temperature updates.
    actor_update_start_step: 50000

teacher:
  enabled_for_rollout_smoke: true
  type: pure_pursuit
  reference_line: centerline
  base_target_speed: 8.0
  lookahead: 1.0
  speed_multiplier: 1.0
  speed_profile:
    type: curvature_limited
    minimum_corner_speed: 3.0
    maximum_lateral_acceleration: 3.0
  # Warmup teacher follows a leading vehicle through GT-only safety control;
  # keep exploration small until the learned LiDAR policy takes over.
  normalized_action_noise_std: 0.05

curriculum:
  # configs/curriculum/step2.yaml defines and validates 2a--2e offline, but the
  # trainer does not consume that schedule yet. Never label this all-NPC run 2a.
  enabled: false
  active_phase: null

reward:
  progress: true
  relative_progress: true
  pass_event: true
  collision: true
  unsafe_contact: true
  offtrack: true
  smoothness: true
  reverse: true
  # Moving or stopped following is allowed in the introductory scenario.
  stalled_behind_vehicle: false
  trajectory_aided:
    # Preserve the Step 1 driving prior while the Step 2 Critic learns traffic.
    # GT remains confined to this scalar reward boundary.
    enabled: true
    weight: 0.3
  weights:
    progress: 1.0
    relative_progress: 0.5
    # Three first passes can add at most 90 reward versus roughly 343 m of
    # one-lap progress. Failure penalties retain the stable Step-1 scale.
    pass: 30.0
    collision: 50.0
    unsafe_contact: 0.25
    off_track: 100.0
    smoothness: 0.05
    reverse: 1.0
    stalled_behind: 0.0
  overtaking:
    behind_distance: 0.5
    ahead_distance: 1.0
    hold_steps: 10
    cooldown_steps: 100
    # Temporary low-weight center-distance proxy for the 0.58 x 0.31 m car.
    # Replace with oriented-body clearance/TTC before AWSIM transfer.
    unsafe_contact_distance: 0.75
    stalled_max_forward_gap: 8.0
    stalled_speed_threshold: 0.25

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_step2
