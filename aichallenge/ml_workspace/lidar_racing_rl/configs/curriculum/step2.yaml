# Source contract for blueprint Step 2-A through 2-E. The current trainer does
# not consume this group yet; phase 2e is additionally blocked by the Python API.
schema_version: 1
active_phase: 2a
ordered_phases: [2a, 2b, 2c, 2d, 2e]

information_boundary:
  learned_ego_agent_index: 0
  learned_agent_count: 1
  actor_observation: lidar_only
  critic_observation: lidar_only
  replay_scope: ego_only
  save_npc_transitions: false

phases:
  2a:
    active_npc_count: 1
    speed_multiplier: {min: 0.65, max: 0.80}
    line_mode: centerline
    lateral_offset: {min: 0.0, max: 0.0}
    control_delay_steps: {min: 0, max: 0}
    braking_event:
      enabled: false
      probability: 0.0
      start_step: {min: 100, max: 1200}
      duration_steps: {min: 10, max: 60}
      acceleration: -2.0
    opponent_source: fixed_pure_pursuit
    training_supported: true

  2b:
    active_npc_count: 3
    speed_multiplier: {min: 0.65, max: 1.05}
    line_mode: centerline
    lateral_offset: {min: 0.0, max: 0.0}
    control_delay_steps: {min: 0, max: 0}
    braking_event:
      enabled: false
      probability: 0.0
      start_step: {min: 100, max: 1200}
      duration_steps: {min: 10, max: 60}
      acceleration: -2.0
    opponent_source: fixed_pure_pursuit
    training_supported: true

  2c:
    active_npc_count: 3
    speed_multiplier: {min: 0.65, max: 1.05}
    line_mode: random_offset
    lateral_offset: {min: -0.20, max: 0.20}
    control_delay_steps: {min: 0, max: 0}
    braking_event:
      enabled: false
      probability: 0.0
      start_step: {min: 100, max: 1200}
      duration_steps: {min: 10, max: 60}
      acceleration: -2.0
    opponent_source: fixed_pure_pursuit
    training_supported: true

  2d:
    active_npc_count: 3
    speed_multiplier: {min: 0.65, max: 1.05}
    line_mode: random_offset
    lateral_offset: {min: -0.20, max: 0.20}
    control_delay_steps: {min: 0, max: 2}
    braking_event:
      enabled: true
      probability: 0.15
      start_step: {min: 100, max: 1200}
      duration_steps: {min: 10, max: 60}
      acceleration: -2.0
    opponent_source: fixed_pure_pursuit
    training_supported: true

  2e:
    active_npc_count: 3
    speed_multiplier: {min: 0.65, max: 1.05}
    line_mode: random_offset
    lateral_offset: {min: -0.20, max: 0.20}
    control_delay_steps: {min: 0, max: 2}
    braking_event:
      enabled: true
      probability: 0.15
      start_step: {min: 100, max: 1200}
      duration_steps: {min: 10, max: 60}
      acceleration: -2.0
    opponent_source: checkpoint_pool
    # Offline manifest validation exists, but past-Actor loading is unimplemented.
    training_supported: false
