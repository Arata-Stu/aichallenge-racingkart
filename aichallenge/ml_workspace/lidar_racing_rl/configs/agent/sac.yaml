algorithm:
  name: sac
  continuous_actions: true
  automatic_entropy_tuning: true
  twin_critic: true
  target_critic: true
  polyak_averaging: true
  gradient_clip_norm: 10.0
  detect_non_finite: true

observation:
  num_beams: 360
  frame_stack: 4
  channels_per_frame: 2
  input_shape: [8, 360]
  lidar_only: true

actor:
  distribution: tanh_gaussian
  encoder:
    type: conv1d
    channels: [32, 64, 64]
    kernel_sizes: [8, 4, 3]
    strides: [4, 2, 1]
    activation: relu
  hidden_sizes: [256]
  action_dim: 2
  log_std_min: -5.0
  log_std_max: 2.0
  deterministic_evaluation: true

critic:
  count: 2
  share_lidar_encoder: false
  hidden_sizes: [256, 256]

optimizer:
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  temperature_learning_rate: 0.0003
  initial_temperature: 1.0

update:
  discount: 0.99
  target_smoothing_coefficient: 0.005
  target_entropy: -2.0
  batch_size: 256
  # One collection adds env.num_envs transitions.  Keep the default update-to-data
  # ratio at 1 so the Actor learns from the teacher warmup before collecting its
  # first post-warmup transition batch.
  updates_per_collection: 64

replay_buffer:
  implementation: jax_ring
  # float16 current+next 4x2x360 observations use about 1.07 GiB at this size.
  capacity: 100000
  warmup_transitions: 10000
  observation_storage_dtype: float16
  store_fields: [observation, action, reward, terminated, truncated, next_observation]
  ego_only: true

checkpoint:
  implementation: flax_msgpack_atomic
  # A one-million-transition Step 1 run performs roughly one million updates at
  # the default UTD ratio.  Preserve the learning curve instead of retaining only
  # the final three (which may have regressed) policies.
  save_interval_updates: 50000
  keep_last: 20
