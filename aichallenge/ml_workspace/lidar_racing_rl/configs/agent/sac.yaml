algorithm:
  name: sac
  continuous_actions: true
  automatic_entropy_tuning: true
  twin_critic: true
  target_critic: true
  polyak_averaging: true
  gradient_clip_norm: 10.0
  detect_non_finite: true

observation:
  num_beams: 360
  frame_stack: 4
  channels_per_frame: 2
  input_shape: [8, 360]
  lidar_only: true

actor:
  distribution: tanh_gaussian
  encoder:
    type: conv1d
    channels: [32, 64, 64]
    kernel_sizes: [8, 4, 3]
    strides: [4, 2, 1]
    activation: relu
  hidden_sizes: [256]
  action_dim: 2
  log_std_min: -5.0
  log_std_max: 2.0
  deterministic_evaluation: true

critic:
  count: 2
  share_lidar_encoder: false
  hidden_sizes: [256, 256]

optimizer:
  # Conservative rates for the sustained UTD=1 run.  The former 3e-4 rates
  # reached an unsafe high-progress/off-track policy before 180k transitions.
  actor_learning_rate: 0.0001
  critic_learning_rate: 0.0001
  temperature_learning_rate: 0.0001
  initial_temperature: 1.0

update:
  discount: 0.99
  target_smoothing_coefficient: 0.005
  target_entropy: -2.0
  # Step 1 updates Actor/Critic/temperature together. Transfer stages may
  # override this to pretrain a new Critic before changing a warm-start Actor.
  actor_update_start_step: 0
  # Number of learner updates used to blend rollout behavior from the GT-only
  # teacher to the Actor after Actor updates start. Step 1 switches directly.
  actor_behavior_blend_updates: 0
  batch_size: 256
  # One collection adds env.num_envs transitions.  Keep the default update-to-data
  # ratio at 1 so the Actor learns from the teacher warmup before collecting its
  # first post-warmup transition batch.
  updates_per_collection: 64

replay_buffer:
  implementation: jax_ring
  # Measured allocation is about 1.15 GB (1.07 GiB) per 100k entries.  A 250k
  # buffer requires a contiguous 1.34 GiB observation array and OOMs on the
  # 8 GiB RTX 4060 during XLA initialization; 150k retains safe headroom.
  capacity: 150000
  warmup_transitions: 50000
  observation_storage_dtype: float16
  store_fields: [observation, action, reward, terminated, truncated, next_observation]
  ego_only: true

checkpoint:
  implementation: flax_msgpack_atomic
  # A one-million-transition Step 1 run performs roughly one million updates at
  # the default UTD ratio.  Preserve the learning curve instead of retaining only
  # the final three (which may have regressed) policies.
  save_interval_updates: 50000
  keep_last: 20
