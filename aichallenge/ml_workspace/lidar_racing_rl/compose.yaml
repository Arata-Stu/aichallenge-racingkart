services:
  lidar-rl:
    image: aichallenge-lidar-racing-rl:dev
    build:
      context: ./docker
      dockerfile: Dockerfile
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace/aichallenge/ml_workspace/lidar_racing_rl
    environment:
      HOME: /tmp/lidar-rl-home
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      UV_CACHE_DIR: /opt/uv-cache
      UV_LINK_MODE: copy
      UV_PROJECT_ENVIRONMENT: /opt/lidar-rl-venv
      UV_PYTHON_DOWNLOADS: never
      VIRTUAL_ENV: /opt/lidar-rl-venv
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
    volumes:
      # The root mount is required for root/submodule commit provenance and
      # keeps training outputs visible to the host.
      - ../../..:/workspace
      # Never share a host .venv between macOS, Linux CPU, and Linux CUDA.
      - lidar-rl-venv:/opt/lidar-rl-venv
      - lidar-rl-uv-cache:/opt/uv-cache
    command: ["sleep", "infinity"]

volumes:
  lidar-rl-venv:
  lidar-rl-uv-cache:
