[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lidar-racing-rl"
version = "0.1.0"
description = "LiDAR-only JAX reinforcement learning for the Automotive AI Challenge racing kart"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "distrax",
  "flax",
  "hydra-core>=1.3,<1.4",
  "jax>=0.7.2,<0.8",
  "matplotlib",
  "numpy",
  "omegaconf>=2.3,<3",
  "optax",
  "pandas",
  "scipy",
  "tensorboard",
]

[project.optional-dependencies]
# CUDA support is opt-in because the correct wheel depends on the execution host.
cuda = [
  "jax[cuda12]>=0.7.2,<0.8",
  "jax-cuda12-plugin[with-cuda]>=0.7.2,<0.8; sys_platform == 'linux'",
]
# The path source is intentionally optional. Initialize the submodule before syncing.
f1tenth = ["f1tenth-gym-jax", "jax-pf"]
# Match the AI Challenge runtime's state_dict writer/reader version. PyTorch is
# required only for export/parity checks, not for JAX training.
export = ["torch==2.3.1"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[tool.uv.sources]
# This path becomes an editable package after `git submodule update --init --recursive`.
# Keeping it as a path source avoids an accidental dependency on a floating Git branch.
f1tenth-gym-jax = { path = "repos/f1tenth_gym_jax", editable = true }
# F1TENTH Gym JAX declares this ray marcher through a floating Git source in
# its own project. Repeat it at the root with the commit from upstream's lock
# so dependency resolution cannot silently move with jax_pf/main.
jax-pf = { git = "https://github.com/hzheng40/jax_pf", rev = "1b1417d7d2afbf24a9c6594195c2e872a6b4460a" }

[tool.uv]
# jax-pf's package metadata still caps JAX below 0.7, while the pinned source
# is the exact revision that F1TENTH Gym JAX resolves and locks with JAX 0.7.2.
# Overrides from a path dependency are not inherited by the root uv project,
# so repeat the fork's root-level compatibility contract here.
override-dependencies = ["jax>=0.7.2,<0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/lidar_racing_rl"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
